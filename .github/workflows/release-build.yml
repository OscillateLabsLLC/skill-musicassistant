name: Release Build

# Releases are created by release-please with the Actions token, and events
# raised by that token never start other workflows, so the "release" trigger
# alone published nothing after 0.2.1. release-please.yml calls this workflow
# directly when it cuts a release; the other triggers stay for manual use.
on:
  release:
    types: [created]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # PyPI trusted publishing; unused when the PYPI_TOKEN secret is set
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # an empty password makes the action fall back to trusted publishing
          password: ${{ secrets.PYPI_TOKEN }}
