name: Update skill.json
# Runs on every branch but main: branch protection rejects the bot's direct
# push there, and skill.json is already regenerated on the branch that merges.
on:
  push:
    branches-ignore:
      - main
permissions:
  contents: write

jobs:
  update_skill_json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: action/skill
      - name: Get Updated skill.json
        run: |
          pip install toml
          python action/skill/.github/workflows/scripts/update_skill_json.py action/skill
      - name: Push skill.json Change
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update skill.json
          repository: action/skill/
